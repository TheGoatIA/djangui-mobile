name: kauri
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 4.0.1+31

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.8

  # Routing
  go_router: ^17.1.0

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.7.1+4

  # Networking
  chopper: ^8.5.1
  http: ^1.6.0
  http_parser: ^4.1.2

  # Database & Local Storage
  # drift >= 2.32 uses sqlite3's build hooks (see `hooks:` below) to bundle
  # an encryption-capable SQLite build. sqlcipher_flutter_libs is EOL/dead
  # since 0.7.0 and has been removed — see the `hooks` section for its
  # replacement (sqlite3mc, selected via user_defines).
  drift: ^2.32.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4

  # Firebase & Notifications
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0

  # Charts & UI Components
  fl_chart: ^1.2.0
  cached_network_image: ^4.0.4
  flutter_svg: ^2.2.3
  lottie: ^3.3.2
  animations: ^2.1.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  path: ^1.9.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  image_picker: ^1.2.3
  file_picker: ^10.3.8
  fpdart: ^1.2.0
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0

  # PDF & QR
  pdf: ^3.12.0
  printing: ^5.14.2
  qr_flutter: ^4.1.0

  # Biometrics
  local_auth: ^3.0.0
  # Stockage protégé par une clé Keystore/Keychain qui EXIGE elle-même une
  # authentification biométrique matérielle pour être déchiffrée (audit F-01)
  # — contrairement à local_auth seul, qui ne renvoie qu'un booléen que le
  # code appelant est libre d'ignorer ou qu'un hook peut falsifier.
  biometric_storage: ^5.0.1

  # Icons
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  internet_connection_checker: ^3.0.1
  flutter_local_notifications: ^18.0.1
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2
  logger: ^2.7.0
  collection: ^1.19.0
  google_mlkit_text_recognition: ^0.15.1
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.1
  firebase_crashlytics: ^5.0.6
  firebase_performance: ^0.11.1+3
  pinput: ^7.0.0
  flutter_markdown: ^0.7.7+1
  timeago: ^3.7.1
  provider: ^6.1.5+1
  intl_phone_field: ^3.2.0
  record: ^6.2.0
  audioplayers: ^6.1.0
  crypto: ^3.0.7
  confetti: ^0.8.0
  flutter_dynamic_icon_plus: ^1.4.0
  opentelemetry: ^0.18.10
  freerasp: ^7.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  chopper_generator: ^8.6.1
  drift_dev: ^2.32.0
  json_serializable: ^6.8.0

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

# Selects the encryption-capable (SQLite3MultipleCiphers) build of SQLite
# instead of the plain, unencrypted one — required for the `PRAGMA key`
# call in lib/core/database/database.dart to actually encrypt the local
# database rather than silently no-op.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  notification_icon:
    android: true
    image_path: "assets/images/ic_notification.png"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/placeholders/
    - assets/images/icons/
    - assets/images/animations/
    # NOTE: .env a ete retire des assets intentionnellement.
    # Les URLs d'API passent via --dart-define-from-file=dart_defines.json
    # a la compilation. Ne jamais bundler des fichiers de secrets dans les assets.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit/Outfit-Bold.ttf
          weight: 700
