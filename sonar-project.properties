# SonarQube Kauri — https://sonar.kauri-app.com (plugin Flutter/Dart installé sur l'instance)
sonar.projectKey=kauri-mobile
sonar.projectName=Kauri Mobile
sonar.sourceEncoding=UTF-8

sonar.sources=lib
sonar.tests=test
sonar.exclusions=**/*.g.dart,**/*.chopper.dart,**/*.freezed.dart,**/injection.config.dart,lib/firebase_options.dart,lib/l10n/app_localizations*.dart,**/analysis_options.yaml

# Rapports produits par la CI (voir .github/workflows/main.yml) :
#   flutter test --coverage --machine > test-report.json   -> coverage/lcov.info
# L'analyse statique (dart analyze) est exécutée par le plugin lui-même.
sonar.flutter.coverage.reportPath=coverage/lcov.info
sonar.flutter.tests.reportPath=test-report.json
sonar.coverage.exclusions=**/*.g.dart,**/*.chopper.dart,**/injection.config.dart,lib/firebase_options.dart,lib/l10n/**
