name: Mobile CI

# Qualité · tests (unitaires, widgets, non-régression) · sécurité · SonarQube.
# La RELEASE (APK/AAB/IPA signés) reste construite par Codemagic ; ce workflow garantit que
# le code poussé sur dev/main est sain et que l'application compile pour l'API Android 36.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  # Plancher de non-régression de la couverture de lignes (hors code généré). À RELEVER au fil
  # de l'ajout de tests, jamais à baisser.
  MIN_COVERAGE: '2.5'

jobs:
  quality:
    name: 🧹 Format · Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatage (dart format)
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyse statique (aucune alerte tolérée)
        run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: 🧪 Tests unitaires + widgets + non-régression (couverture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tests avec couverture
        run: flutter test --coverage --machine > test-report.json
      - name: Plancher de couverture
        run: bash tool/check_coverage.sh "$MIN_COVERAGE"
      - name: Publier couverture et rapport de tests (utilisés par Sonar)
        uses: actions/upload-artifact@v7
        with:
          name: flutter-reports
          path: |
            coverage/lcov.info
            test-report.json
          retention-days: 7

  android-build:
    name: 🤖 Compilation Android (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Libérer de l'espace disque (runner ~14 Go libres)
        # Le build Android debug (3 ABI, ML Kit, Firebase, SQLite…) dépasse l'espace libre d'un
        # runner standard : "No space left on device" pendant D8/dexing. On supprime les chaînes
        # d'outils préinstallées dont ce job n'a pas besoin (le SDK Android est conservé).
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
                      /usr/local/graalvm /usr/local/share/powershell /opt/microsoft \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/chromium || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h / | tail -1
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Mémoire Gradle adaptée au runner
        # android/gradle.properties demande -Xmx8G / MaxMetaspaceSize=4G (poste de dev). Un runner
        # GitHub n'a que ~7 Go : le démon Gradle y est tué (OOM). Les propriétés du dossier
        # utilisateur ont priorité sur celles du projet, sans modifier le dépôt.
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "kotlin.daemon.jvm.options=-Xmx1g"
          } >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties
      - run: flutter pub get
      - name: Build APK debug (sans secrets, valeurs de test)
        run: |
          # Une seule ABI (arm64) : triple l'espace/temps sinon, et suffit à prouver que le projet
          # compile pour l'API 36. Les APK/AAB complets sont produits par Codemagic.
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define=API_BASE_URL=https://staging.kauri-app.com/api/v1 \
            --dart-define=ENV=staging
          df -h / | tail -1
      - name: "Non-régression SDK : targetSdk et compileSdk = 36"
        run: |
          set -e
          grep -rqs 'android:targetSdkVersion="36"' build/app/intermediates/merged_manifest/debug \
            || { echo "::error::targetSdkVersion != 36"; \
                 grep -rhs 'targetSdkVersion' build/app/intermediates/merged_manifest/debug || true; exit 1; }
          grep -q 'compileSdk = 36' android/app/build.gradle.kts || { echo "::error::compileSdk != 36"; exit 1; }
          grep -q 'targetSdk = 36' android/app/build.gradle.kts || { echo "::error::targetSdk != 36"; exit 1; }
          echo "targetSdk 36 / compileSdk 36 : OK"
      - name: "Non-régression : lien vérifié (App Links) du reset de mot de passe"
        run: |
          grep -q 'android:autoVerify="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:pathPrefix="/reset-password"' android/app/src/main/AndroidManifest.xml
      - name: Diagnostic en cas d'échec (journaux Gradle / mémoire)
        if: failure()
        run: |
          free -h || true
          df -h / || true
          ls -la android/*.log android/hs_err_pid*.log 2>/dev/null || true
          find ~/.gradle/daemon -name '*.out.log' -type f 2>/dev/null | head -2 | xargs -r tail -n 60 || true

  security:
    name: 🔒 Sécurité (secrets · dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-git --no-banner --redact --config /repo/.gitleaks.toml
      - name: Vulnérabilités des dépendances Dart (OSV)
        run: |
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v1.9.2 \
            --lockfile=/src/pubspec.lock

  sonar:
    name: 📊 SonarQube (qualité + couverture + Quality Gate)
    needs: [quality, test]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Le plugin Dart exécute `dart analyze` : il lui faut le SDK et les dépendances résolues.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/download-artifact@v8
        with:
          name: flutter-reports
          path: .
      - name: Vérifier la configuration Sonar
        id: cfg
        env:
          T: ${{ secrets.SONAR_TOKEN }}
          U: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$T" ] && [ -n "$U" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::SONAR_TOKEN / SONAR_HOST_URL non définis : analyse Sonar ignorée"; fi
      - name: Analyse + Quality Gate
        if: steps.cfg.outputs.ready == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.projectVersion=${{ github.sha }}
