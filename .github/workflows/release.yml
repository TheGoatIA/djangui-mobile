name: Release — version, changelog et notes de store

# Chaîne de publication en PRODUCTION (mobile) :
#   PR dev → main  →  « Mobile CI » réussie sur main  →  CE workflow :
#     1. calcule la version (Conventional Commits) + l'édition (constellation) + le build ;
#     2. met à jour pubspec.yaml, CHANGELOG.md (FR/EN), RELEASE_NOTES.md, release_notes.json,
#        release/versions.json et lib/core/config/app_release.dart ;
#     3. commit « chore(release): vX.Y.Z - <Edition> Edition » + tag vX.Y.Z sur main ;
#     4. resynchronise dev avec main.
#   Le tag vX.Y.Z déclenche Codemagic (éditeur visuel), qui construit et publie sur les stores
#   avec les notes de release_notes.json.
#
# Secrets : GEMINI_API_KEY (rédaction FR/EN, optionnel — repli automatique sinon),
#           APP_STORE_CONNECT_* (optionnels — pour garantir un build > dernier build TestFlight).

on:
  workflow_run:
    workflows: ['Mobile CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 🏷️ Nouvelle version
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.guard.outputs.skip == 'false' && steps.rel.outputs.released == 'true' }}
      tag: ${{ steps.rel.outputs.tag }}
      title: ${{ steps.rel.outputs.title }}
      build: ${{ steps.rel.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Rien à faire si main a déjà avancé ou si c'est un commit de version
        id: guard
        env:
          VALIDATED: ${{ github.event.workflow_run.head_sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          SUBJECT=$(git log -1 --format=%s)
          if [ -n "$VALIDATED" ] && [ "$VALIDATED" != "$HEAD_SHA" ]; then
            echo "main a avancé depuis le commit validé ($VALIDATED) : la CI du nouveau commit déclenchera la version."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif echo "$SUBJECT" | grep -q '^chore(release):'; then
            echo "Commit de version : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: '22'

      - name: Dernier build connu sur App Store Connect (optionnel)
        if: steps.guard.outputs.skip == 'false'
        id: store
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then echo "latest=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          pip3 install -q codemagic-cli-tools
          LATEST=$(app-store-connect get-latest-build-number 6757806640 2>/dev/null || echo 0)
          echo "Dernier build App Store / TestFlight : $LATEST"
          echo "latest=${LATEST:-0}" >> "$GITHUB_OUTPUT"

      - name: Calcul de la version et génération des fichiers
        if: steps.guard.outputs.skip == 'false'
        id: rel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LATEST_STORE_BUILD: ${{ steps.store.outputs.latest }}
        run: node tool/release/release.mjs

      - name: Notes de version (français) pour Slack
        id: notes
        if: steps.guard.outputs.skip == 'false' && steps.rel.outputs.released == 'true'
        run: |
          {
            echo "fr<<EOF_NOTES"
            echo "*Notes de version*"
            sed -n '/## 🇫🇷/,/## 🇬🇧/p' RELEASE_NOTES.md | sed '1d;$d' | sed '/^\s*$/d' | head -15
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Commit, tag et synchronisation de dev
        if: steps.guard.outputs.skip == 'false' && steps.rel.outputs.released == 'true'
        env:
          TITLE: ${{ steps.rel.outputs.title }}
          TAG: ${{ steps.rel.outputs.tag }}
          BUILD: ${{ steps.rel.outputs.build }}
        run: |
          git config user.name "kauri-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md RELEASE_NOTES.md release_notes.json release/versions.json lib/core/config/app_release.dart
          git commit -m "chore(release): $TITLE (build $BUILD)"
          git tag -a "$TAG" -m "$TITLE (build $BUILD)"
          git push origin HEAD:main
          git push origin "$TAG"
          {
            echo "### 🏷️ $TITLE (build $BUILD)"
            echo
            echo "Tag \`$TAG\` poussé : Codemagic construit et publie sur les stores."
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"
          # dev doit repartir de la version publiée (pubspec, changelog) ; un conflit
          # éventuel n'annule pas la version déjà taguée : il est seulement signalé.
          git fetch origin dev
          git checkout -B dev origin/dev
          if git merge --no-edit main; then
            git push origin dev
          else
            git merge --abort || true
            echo "::warning::Synchronisation main → dev en conflit : fusionner main dans dev manuellement."
          fi

      - name: Notification Slack (#deployment)
        if: always() && steps.guard.outputs.skip == 'false' && steps.rel.outputs.released != 'false'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          COMPONENT: Mobile
          ACTION: Nouvelle version
          ENVIRONMENT: PRODUCTION
          VERSION: ${{ steps.rel.outputs.title }} (build ${{ steps.rel.outputs.build }})
          LINK: Tag ${{ steps.rel.outputs.tag }} — publication Play Store (test interne) et TestFlight (Kauri PRODUCTION)
          DETAILS: ${{ steps.notes.outputs.fr }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message }}
        run: bash .github/scripts/notify-slack.sh

  # ---------------------------------------------------------------- PUBLICATION
  # Publication dans les stores (remplace Codemagic). Lancée ici et non par le tag :
  # un tag créé avec GITHUB_TOKEN ne déclenche aucun autre workflow.
  # Jamais de mise en ligne publique automatique : Play Store en TEST INTERNE,
  # iOS sur TestFlight (groupe Kauri PRODUCTION). La promotion en production
  # (Play Console) et la soumission à la revue Apple restent des actions manuelles.

  android-production:
    name: 🤖 Android → Play Store (test interne)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Vérifier les secrets requis
        env:
          KS: ${{ secrets.ANDROID_PROD_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KS" ] || [ -z "$PLAY" ]; then
            echo "::error::ANDROID_PROD_KEYSTORE_BASE64 ou GOOGLE_PLAY_SERVICE_ACCOUNT_JSON manquant"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Libérer de l'espace disque
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/graalvm /opt/microsoft || true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Signature (clé d'importation de production)
        env:
          KS: ${{ secrets.ANDROID_PROD_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > android/app/kauri-upload.jks
          cat > android/key.properties <<EOF
          storeFile=kauri-upload.jks
          storePassword=${{ secrets.ANDROID_PROD_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_PROD_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_PROD_KEY_PASSWORD }}
          EOF

      - name: Configuration production (dart-defines)
        env:
          DEFINES: ${{ secrets.DART_DEFINES_PRODUCTION_JSON }}
        run: |
          if [ -n "$DEFINES" ]; then
            echo "$DEFINES" > dart_defines.prod.json
          else
            echo '{"API_BASE_URL":"https://api.kauri-app.com/api/v1","ENV":"production","ENABLE_REAL_MONEY":"false"}' > dart_defines.prod.json
          fi
          node tool/release/check-prod-defines.mjs dart_defines.prod.json

      - name: Build App Bundle (version et build de pubspec.yaml)
        run: flutter build appbundle --release --dart-define-from-file=dart_defines.prod.json

      - name: Notes « Nouveautés » (FR / EN) depuis release_notes.json
        run: node tool/release/whatsnew.mjs release_notes.json whatsnew

      - name: Envoi sur Google Play (test interne)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cm.tbg.kauri
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: whatsnew

      - name: Notification Slack (#deployment)
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          COMPONENT: Mobile Android
          ACTION: Publication Play Store
          ENVIRONMENT: PRODUCTION
          VERSION: ${{ needs.release.outputs.title }} (build ${{ needs.release.outputs.build }})
          LINK: Google Play — piste « Test interne » (à promouvoir en production dans la Play Console)
          COMMIT_MSG: ${{ needs.release.outputs.title }}
        run: bash .github/scripts/notify-slack.sh

      - name: Nettoyage des fichiers sensibles
        if: always()
        run: rm -f android/app/kauri-upload.jks android/key.properties dart_defines.prod.json

  ios-production:
    name: 🍏 iOS → TestFlight (Kauri PRODUCTION)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Xcode 26 (SDK iOS 26 requis)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::Aucun Xcode 26 sur ce runner"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Outils de signature (codemagic-cli-tools)
        run: pip3 install --break-system-packages codemagic-cli-tools

      - run: flutter pub get

      - name: Pods
        run: cd ios && pod install --repo-update

      - name: Certificat + profil App Store
        run: |
          keychain initialize
          app-store-connect fetch-signing-files cm.tbg.kauri --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Configuration production (dart-defines)
        env:
          DEFINES: ${{ secrets.DART_DEFINES_PRODUCTION_JSON }}
        run: |
          if [ -n "$DEFINES" ]; then
            echo "$DEFINES" > dart_defines.prod.json
          else
            echo '{"API_BASE_URL":"https://api.kauri-app.com/api/v1","ENV":"production","ENABLE_REAL_MONEY":"false"}' > dart_defines.prod.json
          fi
          node tool/release/check-prod-defines.mjs dart_defines.prod.json

      - name: Build IPA (version et build de pubspec.yaml)
        run: |
          if ! flutter build ipa --release -v --dart-define-from-file=dart_defines.prod.json \
            --export-options-plist="$HOME/export_options.plist" > build-ios.log 2>&1; then
            grep -nE "error:|: error" build-ios.log | head -40
            tail -60 build-ios.log
            exit 1
          fi

      - name: Envoi sur TestFlight (groupe Kauri PRODUCTION)
        run: |
          NOTES=$(node tool/release/whatsnew.mjs release_notes.json --print fr-FR)
          app-store-connect publish \
            --path "$(ls build/ios/ipa/*.ipa | head -1)" \
            --testflight \
            --beta-group "Kauri PRODUCTION" \
            --whats-new "$NOTES"

      - name: Notification Slack (#deployment)
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          COMPONENT: Mobile iOS
          ACTION: Envoi TestFlight
          ENVIRONMENT: PRODUCTION
          VERSION: ${{ needs.release.outputs.title }} (build ${{ needs.release.outputs.build }})
          LINK: TestFlight — groupe « Kauri PRODUCTION » (soumettre à la revue Apple depuis App Store Connect)
          COMMIT_MSG: ${{ needs.release.outputs.title }}
        run: bash .github/scripts/notify-slack.sh

      - name: Nettoyage
        if: always()
        run: |
          keychain use-login || true
          rm -f dart_defines.prod.json
