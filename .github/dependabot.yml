# Mises à jour de dépendances REGROUPÉES (au plus 2 PR par type et par semaine) :
# chaque PR lance toute la CI (et peut déclencher des builds mobiles coûteux).
# Les alertes de sécurité restent traitées par Dependabot security updates.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Douala"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "permission_handler"
        update-types: ["version-update:semver-major"]
      - dependency-name: "permission_handler_android"
        update-types: ["version-update:semver-major"]
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pub-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Douala"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(android)"
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      gradle-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Douala"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
