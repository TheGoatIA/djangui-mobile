# Dependabot — djangui-mobile
# Hebdomadaire (lundi), uniquement vers `dev`. Les montées majeures de plugins Flutter
# restent des PRs séparées ; minor/patch sont groupées. Un `flutter pub get` + analyse +
# tests tournent sur chaque PR (voir .github/workflows/ci.yml).
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Douala"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # permission_handler 13.x -> permission_handler_android 14.x exige compileSdk 37 ("android-37"),
      # que la toolchain actuelle (AGP 8.11 / Gradle 8.14) ne sait pas résoudre : le build de release
      # Codemagic échoue. À réactiver après migration vers AGP >= 9 (voir DEPLOYMENT.md).
      - dependency-name: "permission_handler"
        update-types: ["version-update:semver-major"]
      - dependency-name: "permission_handler_android"
        update-types: ["version-update:semver-major"]
    groups:
      # Les plugins FlutterFire DOIVENT évoluer ensemble (même version de firebase_core) : des versions
      # décalées font échouer la résolution Swift Package Manager côté iOS
      # ("firebase_core-X depends on flutterfire X… and firebase_performance-Y depends on flutterfire Y…").
      # Dependabot propose donc UNE seule PR pour tout le groupe, majeures comprises.
      firebase:
        patterns: ["firebase_*", "_flutterfire_internals"]
      pub-minor-patch:
        update-types: ["minor", "patch"]

  # Gradle (plugins Android / Firebase) — le répertoire est celui du projet Android
  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Douala"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(android)"
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Douala"
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
